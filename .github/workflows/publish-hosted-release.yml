name: Publish signed hosted release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-hosted-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Download and verify the approved signed APK
        run: |
          python3 - <<'PY'
          import pathlib,urllib.request,hashlib,os,subprocess,re
          name='HasbreoMessage-Phone-v1.1.0.apk'
          request=urllib.request.Request('https://hasbreo.com/downloads/message/v1.1.0/'+name,headers={'User-Agent':'Mozilla/5.0 (compatible; HasbreoRelease/1.1)'})
          with urllib.request.urlopen(request,timeout=120) as response: data=response.read(50000001)
          assert len(data)==11133621
          assert hashlib.sha256(data).hexdigest()=='5df4bb1b980bb9207799e64731ffdef02c59ff3b17ab8712077f213a95f46d5c'
          pathlib.Path(name).write_bytes(data)
          tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          output=subprocess.check_output([str(tools/'apksigner'),'verify','--print-certs',name],text=True)
          assert re.search(r'Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]+)',output).group(1).lower()=='f8f0aeecdfa22895d2a451b9fbaf7529ff747d1fc1f8711e13cbed123933ddfb'
          info=subprocess.check_output([str(tools/'aapt2'),'dump','badging',name],text=True)
          assert "name='com.hasbreo.message'" in info and "versionName='1.1.0'" in info and "versionCode='10100'" in info
          pathlib.Path('SHA256SUMS.txt').write_text('5df4bb1b980bb9207799e64731ffdef02c59ff3b17ab8712077f213a95f46d5c  '+name+'\n')
          PY
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 HasbreoMessage-Phone-v1.1.0.apk SHA256SUMS.txt --clobber
          else
            gh release create v1.1.0 HasbreoMessage-Phone-v1.1.0.apk SHA256SUMS.txt --target 5365a37ff4aa8d92fa079eb355fafe61dfdacb69 --prerelease --title "Hasbreo Message Phone v1.1.0" --notes-file RELEASE_NOTES.md
          fi
