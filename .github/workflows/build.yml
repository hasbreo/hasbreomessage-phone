name: Android checks
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['release/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.MESSAGE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: cd web && npm test && npm run test:ui
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease
      - name: Optional release signing
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          MESSAGE_KEYSTORE_BASE64: ${{ secrets.MESSAGE_KEYSTORE_BASE64 }}
          MESSAGE_KEYSTORE_PASSWORD: ${{ secrets.MESSAGE_KEYSTORE_PASSWORD }}
          MESSAGE_KEY_PASSWORD: ${{ secrets.MESSAGE_KEY_PASSWORD }}
        run: python3 scripts/sign-apk.py app/build/outputs/apk/release/app-release-unsigned.apk app/build/distributions/HasbreoMessage-Phone-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HasbreoMessage-Phone-build
          path: |
            app/build/outputs/apk/release/*-unsigned.apk
            app/build/distributions/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-check-reports
          path: |
            app/build/reports
            app/build/test-results
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HasbreoMessage-Phone-build
          path: output
      - name: Publish only a signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(find output -name '*-signed.apk' -print -quit)
          test -n "$apk"
          cp "$apk" "HasbreoMessage-Phone-${GITHUB_REF_NAME}.apk"
          sha256sum "HasbreoMessage-Phone-${GITHUB_REF_NAME}.apk" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "HasbreoMessage-Phone-${GITHUB_REF_NAME}.apk" SHA256SUMS.txt --title "Hasbreo Message Phone ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
