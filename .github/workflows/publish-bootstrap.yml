name: Publish verified first release
on:
  push:
    branches: [main]
    paths: ['release/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Verify checksum, certificate, package and version
        run: python3 scripts/verify-bootstrap.py
      - name: Publish signed APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("release/manifest.json"))["version"])')
          source=$(python3 -c 'import json; print(json.load(open("release/manifest.json"))["sourceCommit"])')
          filename=$(python3 -c 'import json; print(json.load(open("release/manifest.json"))["filename"])')
          platform=$(python3 -c 'import json; print(json.load(open("release/manifest.json"))["platform"].capitalize())')
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" "$filename" SHA256SUMS.txt --clobber
          else
            gh release create "v$version" "$filename" SHA256SUMS.txt --target "$source" --prerelease --title "Hasbreo Message $platform v$version" --notes-file RELEASE_NOTES.md
          fi
